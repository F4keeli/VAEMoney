# Render: New → Blueprint → point it at this repo.
# A disk is needed so the database survives restarts, and disks are a paid
# feature on Render — on the free plan the data would be wiped on every deploy.
services:
  - type: web
    name: vae
    runtime: node
    plan: starter
    buildCommand: npm install --omit=optional
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: VAE_DATA_DIR
        value: /var/data
    disk:
      name: vae-data
      mountPath: /var/data
      sizeGB: 1
