# Fly.io: fly launch --no-deploy   then   fly volumes create vae_data --size 1   then   fly deploy
app = "vae-team"
primary_region = "fra"

[build]

[env]
  PORT = "8080"
  VAE_DATA_DIR = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

# The database is one file. This volume is what keeps it.
[[mounts]]
  source = "vae_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
